 # AIsztens — deploy to the DigitalOcean droplet (dev now, prod later).
#
# This workflow is the consumer of the images published by
# `.github/workflows/images.yml`. It does NOT build anything; it ships
# a few small files (docker-compose.yml, infra/.env, Caddyfile.rendered,
# the smoke-test suite) and tells the droplet to
# `docker compose pull && up -d` against the images already in GHCR.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   DROPLET_HOST        — droplet public IPv4 or hostname
#   DROPLET_SSH_KEY     — the deploy private key (deploy/ssh-keys/deploy.private.key,
#                         passphrase-less). Logs in as `deployer`; its
#                         PUBLIC half must be in
#                         /home/deployer/.ssh/authorized_keys on the
#                         droplet.
#   INFRA_ENV_DEV       — full contents of infra/.env.dev
#   INFRA_ENV_PROD      — full contents of infra/.env.prod
#   GHCR_PAT            — (only when the repo is private) PAT with
#                         `read:packages` so the droplet can `docker
#                         login ghcr.io` and pull the images.
#
# Triggers:
#   workflow_run on `images.yml` completion -> auto-deploy to dev, ONLY
#     when images.yml succeeded, was started by a `push`, on branch `dev`.
#     IMAGE_TAG = sha-<7 chars of workflow_run.head_sha> (the commit that
#     images.yml actually built — NOT github.sha, which on workflow_run is
#     the default-branch HEAD).
#   workflow_dispatch with `app_env`=dev|prod (+ optional `image_tag`).
#     IMAGE_TAG defaults to sha-<7 chars of the dispatched commit>; the
#     images for that commit must already exist (run images.yml first).
#
# There is deliberately NO `push` trigger: images.yml reacts to the push
# and this workflow follows it via workflow_run. A direct push trigger
# raced the image build and tried to pull a sha tag that did not exist yet.
#
# NOTE: GitHub only fires `workflow_run` for workflow files that exist on
# the repository's DEFAULT branch. Merge this file to the default branch
# for the auto-deploy to work; manual dispatch works from any branch.
#
# Why a `plan` job instead of a matrix + job-level `if:`:
#   `jobs.<id>.if` is evaluated BEFORE the matrix expands, so `matrix.*`
#   there fails with `Unrecognized named-value: 'matrix'`. Allowed
#   contexts in `jobs.<id>.if` are only github | inputs | vars | needs.
#   The `plan` job runs `.github/scripts/deploy-plan.sh` (unit-tested in
#   scripts/test/_deploy-plan-test.sh) and exposes the decision through
#   `needs.plan.outputs.*`, which is allowed in `if:`, `name:` and
#   `environment:`. Do NOT reintroduce `matrix.*` or `env.*` in job-level
#   keys — scripts/test/_deploy-yml-concurrency-audit.py guards this.

name: Deploy to droplet

on:
  workflow_dispatch:
    inputs:
      app_env:
        description: 'Which environment to deploy (dev or prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      image_tag:
        description: 'Optional image tag override (default: sha-<short commit of the selected ref>)'
        required: false
        default: ''
        type: string
  workflow_run:
    workflows: [Build and push images]
    types: [completed]

permissions:
  contents: read

env:
  REMOTE_DIR: /opt/aisztens

jobs:
  # ----------------------------------------------------------------------
  # plan — decide whether / where / what to deploy. No secrets, no SSH.
  # ----------------------------------------------------------------------
  plan:
    name: Plan deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_deploy: ${{ steps.plan.outputs.should_deploy }}
      app_env: ${{ steps.plan.outputs.app_env }}
      image_tag: ${{ steps.plan.outputs.image_tag }}
      ref: ${{ steps.plan.outputs.ref }}
    steps:
      - name: Checkout plan script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
      - name: Decide deploy target
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_APP_ENV: ${{ inputs.app_env }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          HEAD_SHA: ${{ github.sha }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash .github/scripts/deploy-plan.sh

  deploy:
    name: Deploy (${{ needs.plan.outputs.app_env }}) + smoke-test
    needs: plan
    if: needs.plan.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.plan.outputs.app_env == 'prod' && 'production' || 'dev' }}
    # Serialize deploys per environment (needs.* is allowed here).
    concurrency:
      group: deploy-${{ needs.plan.outputs.app_env }}
      cancel-in-progress: false

    steps:
      # ------------------------------------------------------------------
      # 1. Get the source (only the small files we ship) at the exact
      #    commit being deployed.
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          # Defense-in-depth: do not persist the GITHUB_TOKEN in the
          # runner's git config.
          persist-credentials: false
          sparse-checkout: |
            infra/docker-compose.yml
            infra/caddy/Caddyfile
            scripts/test

      # ------------------------------------------------------------------
      # 2. Resolve the per-env secret and expose app_env / image_tag to
      #    the later steps (values come from the `plan` job).
      # ------------------------------------------------------------------
      - name: Resolve INFRA_ENV and IMAGE_TAG
        id: resolve
        env:
          # GitHub Actions expressions have no `upper()`; `app_env` is
          # constrained to dev|prod by deploy-plan.sh, so the secret is
          # selected by equality.
          APP_ENV: ${{ needs.plan.outputs.app_env }}
          IMAGE_TAG: ${{ needs.plan.outputs.image_tag }}
          INFRA_ENV: ${{ needs.plan.outputs.app_env == 'prod' && secrets.INFRA_ENV_PROD || secrets.INFRA_ENV_DEV }}
        run: |
          set -euo pipefail
          if [ -z "$INFRA_ENV" ]; then
            echo "ERROR: INFRA_ENV_${APP_ENV^^} secret is empty (is it defined for the '${APP_ENV}' environment?)." >&2
            exit 1
          fi
          if [ -z "$IMAGE_TAG" ]; then
            echo "ERROR: plan job produced an empty IMAGE_TAG." >&2
            exit 1
          fi
          echo "app_env=$APP_ENV"     >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 3. Render infra/.env from the matching secret.
      #    The file is written with `chmod 0644` here, NOT `0600`, because
      #    the next step (`appleboy/scp-action`) pre-packs the source
      #    files with `tar` inside a container that runs under a different
      #    uid, and a `0600` mode hides the file from that tar process
      #    ("Permission denied" at run time). The droplet-side tightening
      #    to `chmod 600` is performed by the ssh-action step that
      #    immediately follows the scp-action step, so the file is
      #    world-unreadable again before any other process on the host
      #    can read it.
      # ------------------------------------------------------------------
      - name: Render infra/.env from the matching secret
        env:
          # GitHub Actions expressions have no `upper()` (or any case-conversion)
          # function, so we cannot build the secret name with format+upper.
          # `app_env` is constrained to `dev|prod` by deploy-plan.sh; the
          # matching secret is selected by equality.
          # NOTE: the appended block at the end of this step writes
          # APP_ENV / IMAGE_TAG / GHCR_OWNER / REGISTRY into the file,
          # which OVERWRITES any same-named values that the secret may
          # have contained. The intent is for the secret to provide the
          # static config (DOMAIN, ACME_EMAIL, DB passwords, etc.) and
          # for the workflow to inject the runtime-only values. If the
          # secret ever contains APP_ENV / IMAGE_TAG / GHCR_OWNER /
          # REGISTRY, those values will be silently replaced; document
          # this in deploy/README.md and audit the secrets file.
          APP_ENV: ${{ needs.plan.outputs.app_env }}
          INFRA_ENV: ${{ needs.plan.outputs.app_env == 'prod' && secrets.INFRA_ENV_PROD || secrets.INFRA_ENV_DEV }}
        run: |
          set -euo pipefail
          mkdir -p infra
          printf '%s\n' "$INFRA_ENV" > "infra/.env"
          # Defensive: refuse to proceed if the secret defines any of the
          # keys this step appends, because the appended values would
          # silently overwrite them (last write wins). This makes a class
          # of "secret drift" bugs loud rather than silent.
          for key in APP_ENV IMAGE_TAG GHCR_OWNER REGISTRY; do
            if grep -q -E "^${key}=" infra/.env; then
              echo "ERROR: INFRA_ENV_${APP_ENV^^} secret defines ${key}= which would be silently overwritten by deploy.yml." >&2
              echo "       Remove ${key}= from the secret (it is injected below) and re-run." >&2
              exit 1
            fi
          done
          chmod 0644 "infra/.env"
          # IMAGE_TAG and GHCR_OWNER are runtime-only values the droplet
          # needs to construct the image references; the secret holds
          # everything else (DOMAIN, DB passwords, …).
          {
            echo ""
            echo "# Written by deploy.yml"
            echo "APP_ENV=${{ steps.resolve.outputs.app_env }}"
            echo "IMAGE_TAG=${{ steps.resolve.outputs.image_tag }}"
            echo "GHCR_OWNER=${{ vars.GHCR_OWNER || github.repository_owner }}"
            echo "REGISTRY=ghcr.io"
          } >> "infra/.env"
          echo "Rendered infra/.env for APP_ENV=${{ steps.resolve.outputs.app_env }} (IMAGE_TAG=${{ steps.resolve.outputs.image_tag }})."

      # ------------------------------------------------------------------
      # 4. Render the Caddyfile from infra/caddy/Caddyfile using the same
      #    `sed` logic that deploy/deploy.sh:render_caddyfile() uses.
      #    The droplet only ever sees the rendered file.
      #
      #    IMPORTANT: this step assumes the INFRA_ENV_* secret stores
      #    DOMAIN and ACME_EMAIL in a form that survives a round-trip
      #    through `grep | cut | tr` AND through the resulting Caddyfile
      #    template substitution. Concretely:
      #      - shell-style escape (`KEY="value"`) is OK and is the
      #        convention; this step strips the surrounding quotes.
      #      - bare unquoted `KEY=value with spaces` would break
      #        `docker compose --env-file` parsing downstream.
      #    Keep the INFRA_ENV_DEV / INFRA_ENV_PROD secrets consistent
      #    with the format in infra/.env.example.
      # ------------------------------------------------------------------
      - name: Render Caddyfile
        run: |
          set -euo pipefail
          # Strip surrounding quotes (if any) from the DOMAIN / ACME_EMAIL values
          # written to infra/.env by the previous step. The two characters to
          # strip are `"` and `'`. Inside `$(...)` a literal `'` is impossible
          # to pass without one of { ANSI-C `$'\047'`, an intermediate shell
          # var, or switching to `awk`. We use the ANSI-C form so the source
          # line parses cleanly; do not "simplify" `\047` back to a literal `'`,
          # that regresses to `unexpected EOF while looking for matching ''`.
          _quote_chars=$'\"\047'
          # Defensive: bail out if the DOMAIN or ACME_EMAIL values contain
          # the '|' character (would break the sed delimiter below). This
          # is a guard, not a feature — if it ever trips, fix the secret,
          # don't paper over the warning here.
          domain="$(grep -E '^DOMAIN=' infra/.env | head -n1 | cut -d= -f2- | tr -d "$_quote_chars")"
          acme_email="$(grep -E '^ACME_EMAIL=' infra/.env | head -n1 | cut -d= -f2- | tr -d "$_quote_chars")"
          if [ -z "$domain" ] || [ -z "$acme_email" ]; then
            echo "ERROR: DOMAIN and ACME_EMAIL must be set in INFRA_ENV_*." >&2
            exit 1
          fi
          sed -e "s|<DOMAIN>|$domain|g" \
              -e "s|<ACME_EMAIL>|$acme_email|g" \
              infra/caddy/Caddyfile > infra/caddy/Caddyfile.rendered
          if [ -n "$domain" ] && printf '%s' "$domain" | grep -q '|'; then
            echo "ERROR: DOMAIN=$domain contains a '|' character which would break the sed replacement." >&2
            exit 1
          fi
          if [ -n "$acme_email" ] && printf '%s' "$acme_email" | grep -q '|'; then
            echo "ERROR: ACME_EMAIL=$acme_email contains a '|' character which would break the sed replacement." >&2
            exit 1
          fi
          if grep -q '<DOMAIN>\|<ACME_EMAIL>' infra/caddy/Caddyfile.rendered; then
            echo "ERROR: rendered Caddyfile still contains unresolved placeholders." >&2
            exit 1
          fi
          echo "Caddyfile rendered for DOMAIN=$domain."

      # ------------------------------------------------------------------
      # 5. Ship the small files to the droplet. We do NOT rsync the whole
      #    repo; the droplet needs only the compose file, the env, the
      #    rendered Caddyfile, and the smoke-test suite used in step 9.
      # ------------------------------------------------------------------
      - name: Ship compose + env + Caddyfile + smoke tests to droplet
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deployer
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "infra/docker-compose.yml,infra/.env,infra/caddy/Caddyfile.rendered,scripts/test/stack-smoke.sh,scripts/test/lib"
          target: ${{ env.REMOTE_DIR }}
          overwrite: true
          strip_components: 0

      # ------------------------------------------------------------------
      # 5a. Re-tighten infra/.env to `chmod 600` on the droplet.
      #     scp preserves the source file mode, so the file lands on the
      #     droplet as 0644 (see step 3 comment for why we relaxed it).
      #     Before any further step reads the file, restore the
      #     "owner-only readable" posture documented in deploy/README.md.
      #     This step is deliberately a no-op for the Caddyfile and
      #     docker-compose.yml — only the .env carries secrets.
      # ------------------------------------------------------------------
      - name: Tighten infra/.env permissions on the droplet
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deployer
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: REMOTE_DIR
          script: |
            set -euo pipefail
            env_file="$REMOTE_DIR/infra/.env"
            if [ ! -f "$env_file" ]; then
              echo "ERROR: $env_file not found after scp — the scp step may have failed silently." >&2
              exit 1
            fi
            chmod 600 "$env_file"
            mode="$(stat -c '%a' "$env_file")"
            echo "infra/.env on droplet is now mode $mode (was 644 after scp; 600 is the deploy/README.md convention)."

      # ------------------------------------------------------------------
      # 6. Log in to GHCR on the droplet (only when the repo is private;
      #    when public, anonymous pull works). We detect this by trying
      #    a public pull of the api image first; only fall back to login
      #    if that fails. Simpler: always run `docker login` when a PAT
      #    is configured.
      # ------------------------------------------------------------------
      - name: docker login ghcr.io (when GHCR_PAT is set)
        # NOTE: `secrets.*` is not allowed in `if:` expressions in GitHub
        # Actions, so the conditional is performed inside the step body.
        # If GHCR_PAT is unset, the inner guard skips the login; this is
        # the public-repo case where anonymous `docker pull` already works.
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deployer
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: REMOTE_DIR,GHCR_PAT,GITHUB_ACTOR
          script: |
            set -euo pipefail
            if [ -z "${GHCR_PAT:-}" ]; then
              echo "GHCR_PAT is not set; skipping ghcr.io login (anonymous pull is fine for public images)."
              exit 0
            fi
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            echo "GHCR login OK as $GITHUB_ACTOR."

      # ------------------------------------------------------------------
      # 7. Pull the images and (re)start the stack. No `--build`: the
      #    droplet has no source tree and must not attempt to build.
      #    `--force-recreate` ensures that an updated compose file or
      #    a sha-pinned image always materialises; without it, containers
      #    pinned to an old sha can survive a successful pull and leave
      #    the host "live but stale".
      # ------------------------------------------------------------------
      - name: Pull and start the stack
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
          APP_ENV: ${{ steps.resolve.outputs.app_env }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deployer
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: REMOTE_DIR,APP_ENV
          script: |
            set -euo pipefail
            cd "$REMOTE_DIR"
            docker compose \
              --env-file "infra/.env" \
              -f infra/docker-compose.yml \
              pull
            APP_ENV="$APP_ENV" docker compose \
              --env-file "infra/.env" \
              -f infra/docker-compose.yml \
              up -d --remove-orphans --force-recreate

      # ------------------------------------------------------------------
      # 7a. Verify every service is actually running the IMAGE_TAG this
      #     workflow resolved (sha-<short>), not a stale sha from an
      #     earlier deploy (or hand-run leftovers like
      #     `aisztens/api:latest` from a local-override deploy). After
      #     `up -d --remove-orphans --force-recreate`, every application
      #     service (api, web, admin, monitor) should report an image
      #     reference that contains `:$IMAGE_TAG`. Postgres and caddy
      #     are exempt — postgres is the official image and caddy uses
      #     a floating `caddy:2-alpine` tag (no IMAGE_TAG pinning).
      #     Failing here makes the workflow red and prevents the
      #     "stack appears OK but is actually pinned to an old image"
      #     class of silent regressions.
      # ------------------------------------------------------------------
      - name: Verify every service is running IMAGE_TAG
        id: verify-tag
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deployer
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: REMOTE_DIR,IMAGE_TAG
          script: |
            set -euo pipefail
            cd "$REMOTE_DIR"
            echo "Looking for services not running an image at :$IMAGE_TAG (api/web/admin/monitor only)..."
            bad="$(docker compose --env-file "infra/.env" -f infra/docker-compose.yml ps --format '{{.Service}} {{.Image}}' \
                    | awk -v want=":$IMAGE_TAG" '$1 == "api" || $1 == "web" || $1 == "admin" || $1 == "monitor" { if (index($2, want) == 0) print $0 }')"
            if [ -n "$bad" ]; then
              echo ""
              echo "ERROR: the following services are NOT running $IMAGE_TAG:"
              echo "$bad" | sed 's/^/    /'
              echo ""
              echo "Re-pull + recreate is needed. This indicates the host has a stale"
              echo "sha from an earlier run (or a hand-overridden image). To recover:"
              echo "    docker compose --env-file infra/.env -f infra/docker-compose.yml \\"
              echo "      pull && up -d --force-recreate"
              exit 1
            fi
            docker compose --env-file "infra/.env" -f infra/docker-compose.yml ps --format 'table {{.Service}}\t{{.Image}}\t{{.Status}}'
            echo "All 4 application services are running $IMAGE_TAG."

      # ------------------------------------------------------------------
      # 8. Wait for the `api` container healthcheck to become `healthy`.
      #    infra/docker-compose.yml declares interval=15s / retries=5 /
      #    start_period=60s, so 30 × 5s = 150s is more than enough for
      #    first-run image pulls. If the healthcheck never reports
      #    healthy we still proceed so the smoke step can produce a
      #    more diagnostic failure.
      # ------------------------------------------------------------------
      - name: Wait for api healthcheck
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
          APP_ENV: ${{ steps.resolve.outputs.app_env }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deployer
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: REMOTE_DIR,APP_ENV
          script: |
            set -euo pipefail
            cd "$REMOTE_DIR"
            api_id="$(docker compose --env-file "infra/.env" -f infra/docker-compose.yml ps -q api)"
            if [ -z "$api_id" ]; then
              echo "ERROR: api container id is empty — compose did not start it."
              exit 1
            fi
            for i in $(seq 1 30); do
              state="$(docker inspect -f '{{.State.Health.Status}}' "$api_id" 2>/dev/null || echo unknown)"
              echo "probe $i/30: api health = $state"
              if [ "$state" = "healthy" ]; then
                echo "api is healthy after $i probes"
                exit 0
              fi
              sleep 5
            done
            echo "WARN: api did not become healthy within 150s; smoke test will report a precise failure."
            exit 0

      # ------------------------------------------------------------------
      # 9. Run the smoke suite against the live deployment.
      #    scripts/test/stack-smoke.sh exits 0 on full pass, 1 on
      #    failure, 2 if the stack isn't running. Any non-zero value
      #    fails this step, which fails the workflow.
      # ------------------------------------------------------------------
      - name: Run stack smoke tests against live deployment
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deployer
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: REMOTE_DIR
          script: |
            set -euo pipefail
            cd "$REMOTE_DIR"
            bash scripts/test/stack-smoke.sh

      # ------------------------------------------------------------------
      # 10. On failure, dump the last 500 log lines of every container
      #     into the workflow run so triage does not require manual SSH.
      # ------------------------------------------------------------------
      - name: Dump container logs on failure
        if: failure()
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
          APP_ENV: ${{ steps.resolve.outputs.app_env }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deployer
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: REMOTE_DIR,APP_ENV
          script: |
            set +e  # best-effort: always show whatever logs exist
            cd "$REMOTE_DIR"
            echo "===== docker compose ps ====="
            docker compose --env-file "infra/.env" -f infra/docker-compose.yml ps
            echo
            echo "===== last 500 log lines per service ====="
            docker compose --env-file "infra/.env" -f infra/docker-compose.yml \
              logs --no-color --tail=500
            echo
            echo "===== monitor last 200 lines ====="
            docker compose --env-file "infra/.env" -f infra/docker-compose.yml \
              logs --no-color monitor --tail=200 || true
