# AIsztens — production deploy to the DigitalOcean droplet.
#
# Mirrors deploy/deploy.sh + deploy/bootstrap.sh but driven by GitHub Actions:
#   1. Render infra/.env from the matching INFRA_ENV_${APP_ENV} secret
#      (INFRA_ENV_DEV for APP_ENV=dev, INFRA_ENV_PROD for APP_ENV=prod).
#      APP_ENV comes from `inputs.app_env` (workflow_dispatch) or defaults to
#      `dev` for push events; it picks WHICH secret is rendered.
#   2. SCP the repo to /opt/aisztens on the droplet (with --delete, like rsync)
#   3. SCP the secret-rendered infra/.env on top of what was uploaded. A droplet
#      hosts exactly ONE environment, so the runtime env file on disk is always
#      infra/.env — the per-env name exists only locally, as the SOURCE. Every
#      compose command below therefore uses `--env-file infra/.env`, matching
#      deploy/deploy.sh and scripts/test/stack-smoke.sh (see also
#      docs/Specs/Three-Env-Verification.md §3.8).
#   4. Install pnpm + Node 22, build the web + admin SPAs against the matching
#      per-env API base URL via `pnpm ... build:${APP_ENV}` (Vite mode), then
#      SCP the two apps/{web,admin}/dist/ folders to the droplet so the Caddy
#      volume mounts have content to serve.
#   5. SSH in as `deployer` and run `APP_ENV=${APP_ENV} docker compose up -d --build`
#      with `--env-file "infra/.env"`. APP_ENV is exported both as
#      shell env (belt-and-braces) and via the compose `api.environment.APP_ENV`
#      entry — see infra/docker-compose.yml:30.
#   6. Wait for the `api` container to become `healthy` (uses the compose
#      healthcheck declared in infra/docker-compose.yml)
#   7. Run scripts/test/stack-smoke.sh against the live stack — fail the
#      workflow if any of the 4 liveness + 6 cross-service checks fail
#   8. On failure, dump the last 500 log lines of every container for triage
#
# Required secrets (Settings → Secrets and variables → Actions):
#   DROPLET_HOST        — droplet public IPv4 or hostname
#   DROPLET_SSH_KEY     — the deploy private key (deploy/ssh-keys/deploy.private.key,
#                         passphrase-less). Because this workflow logs in as
#                         `deployer`, its PUBLIC half must be present in
#                         /home/deployer/.ssh/authorized_keys on the droplet.
#   INFRA_ENV_DEV       — full contents of infra/.env.dev (multi-line; verbatim copy)
#   INFRA_ENV_PROD      — full contents of infra/.env.prod (multi-line; verbatim copy)
#
# `APP_ENV` selects which per-env file is rendered AND which build mode the
# Vite SPAs use. The push trigger always uses APP_ENV=dev (the only currently
# running target); `workflow_dispatch` lets operators pick dev or prod for
# a one-off deploy. The push-to-dev branch protection + the GitHub
# `production` environment together gate the prod deployer.
#
# The `deployer` user is created by deploy/bootstrap.sh with sudo + docker
# group, so docker compose can run non-interactively without root SSH.
#
# The deploy key is passphrase-less (required for non-interactive CI). The same
# key file is used by the local deploy/deploy.sh, which also logs in as
# `deployer` (see deploy/.env.dev) — the two deploy paths are interchangeable.
# Only `bootstrap` needs a root login, and that is a one-off, hand-run step
# (SSH_USER=root ./deploy/deploy.sh bootstrap) performed before this workflow
# becomes usable.

name: Deploy to droplet

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      app_env:
        description: 'Which environment to deploy (dev or prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

# Normalise the chosen env into a matrix-shaped env for the rest of the
# job. Push always means `dev`; workflow_dispatch uses the operator's pick.
# We also use the value to gate the concurrency group so dev and prod can
# run in parallel (they target different droplets in different environments
# once prod is provisioned).
concurrency:
  group: deploy-${{ inputs.app_env || 'dev' }}
  cancel-in-progress: false

# Fail the workflow if anything runs longer than 30 minutes (covers a slow
# `pnpm install` rebuild on a small droplet).
env:
  REMOTE_DIR: /opt/aisztens

jobs:
  deploy:
    name: Deploy (${{ inputs.app_env || 'dev' }}) + smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.app_env == 'prod' && 'production' || 'dev' }}

    steps:
      # ------------------------------------------------------------------
      # 1. Get the source
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Render infra/.env from the matching GitHub secret.
      #    APP_ENV comes from `inputs.app_env` (workflow_dispatch) or
      #    defaults to `dev` for push events and selects WHICH secret is
      #    used (INFRA_ENV_DEV / INFRA_ENV_PROD). The secret holds the full
      #    multi-line file; we copy it verbatim to infra/.env — the single
      #    runtime path on the droplet, which hosts one environment only.
      #    `chmod 600` matches the convention from deploy/README.md where
      #    the .env files are world-unreadable.
      # ------------------------------------------------------------------
      - name: Render infra/.env from the matching secret
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          app_env="${{ inputs.app_env || 'dev' }}"
          mkdir -p infra
          printf '%s\n' "$INFRA_ENV" > "infra/.env"
          chmod 600 "infra/.env"
          echo "Rendered infra/.env for APP_ENV=${app_env} ($(wc -l < "infra/.env") lines)."
          # Also expose APP_ENV to subsequent steps via $GITHUB_ENV.
          echo "APP_ENV=${app_env}" >> "$GITHUB_ENV"
        env:
          # Pick the matching secret based on APP_ENV (defaults to DEV for
          # the push trigger). An operator dispatching app_env=prod will
          # render infra/.env.prod from INFRA_ENV_PROD; the push trigger
          # never produces APP_ENV=prod, so INFRA_ENV_PROD cannot leak
          # into a dev build. The push-to-prod branch protection + the
          # GitHub `production` environment (see env: line in the deploy
          # job) gate the prod secret independently. `upper()` is required
          # because GitHub secret names are uppercase but `inputs.app_env`
          # is lowercase ('dev' / 'prod').
          INFRA_ENV: ${{ secrets[format('INFRA_ENV_{0}', upper(inputs.app_env || 'dev'))] }}

      # ------------------------------------------------------------------
      # 3. Upload the repo (minus secrets, build artifacts, git history).
      #    `rm: true` mirrors the rsync --delete behaviour used by
      #    deploy/deploy.sh so removed files actually disappear on the
      #    droplet.
      # ------------------------------------------------------------------
      - name: Upload repository to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deployer
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "."
          target: ${{ env.REMOTE_DIR }}
          rm: true
          strip_components: 0
          exclude: |
            .git
            .github/workflows/**
            node_modules
            dist
            coverage
            .env
            infra/.env
            infra/.env.local
            infra/.env.dev
            infra/.env.prod
            deploy/.env
            deploy/.env.local
            deploy/.env.dev
            deploy/.env.prod
            deploy/ssh-keys/

      # ------------------------------------------------------------------
      # 4. Push the secret-rendered infra/.env to the exact path the
      #    compose stack expects, /opt/aisztens/infra/.env. We SCP it
      #    separately so the secret never travels inside the bulk upload
      #    (which uses `rm: true`).
      #
      #    NOTE: scp-action treats `target` as a DIRECTORY and recreates the
      #    source path inside it. `target: .../infra/.env` therefore produced
      #    infra/.env/infra/.env.dev instead of the file compose asks for, while
      #    every compose step below asked for infra/.env.$APP_ENV — two halves
      #    of the same path never agreed. Ship a file that is already named
      #    `.env` and point the target at the directory.
      # ------------------------------------------------------------------
      - name: Upload the rendered infra/.env to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deployer
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "infra/.env"
          target: ${{ env.REMOTE_DIR }}/infra
          overwrite: true

      # ------------------------------------------------------------------
      # 4b. Install pnpm + Node so we can build the SPAs in CI. Pin to the
      #     same versions ci.yml uses so we don't end up with two slightly
      #     different build toolchains in the same repo.
      # ------------------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ------------------------------------------------------------------
      # 4c. Build the web + admin SPAs. Vite picks the per-env file
      #     apps/<app>/.env.${APP_ENV} via the `--mode` flag (see Step 1
      #     of docs/history/2026-10-05--10-30-00-three-env-separation-
      #     plan.md). The `build:${APP_ENV}` script is defined in each
      #     package.json; the build itself runs `tsc --noEmit` for type
      #     safety and then `vite build`. Matches deploy/deploy.sh::
      #     build_spas().
      # ------------------------------------------------------------------
      - name: Build web and admin SPAs
        working-directory: ${{ github.workspace }}
        env:
          APP_ENV: ${{ env.APP_ENV }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          echo "Building SPAs (mode=${APP_ENV}) ..."
          pnpm --filter @callback/web "build:${APP_ENV}"
          pnpm --filter @callback/admin "build:${APP_ENV}"

      # ------------------------------------------------------------------
      # 4d. Push the freshly built apps/{web,admin}/dist/ folders to the
      #     droplet. The bulk SCP upload (step 3) excludes `dist`, so the
      #     Caddy container would otherwise mount empty directories. We
      #     SCP each dist/ separately and use --rm so the previous build
      #     artefacts (asset hashes that no longer exist) are cleaned up.
      # ------------------------------------------------------------------
      - name: Upload SPA dist folders to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deployer
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "apps/web/dist/,apps/admin/dist/"
          target: ${{ env.REMOTE_DIR }}/apps
          rm: true
          overwrite: true
          strip_components: 1

      # ------------------------------------------------------------------
      # 5. Build the images and (re)start the stack. --remove-orphans
      #    cleans up any containers left behind by previous experiments.
      # ------------------------------------------------------------------
      - name: Build and start the stack
        uses: appleboy/ssh-action@v1.0.3
        env:
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
          APP_ENV: ${{ env.APP_ENV }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deployer
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command: |
            set -euo pipefail
            cd "$REMOTE_DIR"
            # APP_ENV is also exported as shell env here as belt-and-braces
            # so a future change to infra/docker-compose.yml that forgets
            # the `APP_ENV: ${APP_ENV:-dev}` line cannot silently run the
            # api container as APP_ENV=dev on a prod droplet.
            APP_ENV="$APP_ENV" docker compose \
              --env-file "infra/.env" \
              -f infra/docker-compose.yml \
              up -d --build --remove-orphans

      # ------------------------------------------------------------------
      # 6. Wait for the `api` container healthcheck to become `healthy`.
      #    infra/docker-compose.yml declares interval=15s / retries=5 /
      #    start_period=30s, so 30 × 5s = 150s is more than enough for
      #    first-run image pulls. If the healthcheck never reports
      #    healthy we still proceed so the smoke step can produce a
      #    more diagnostic failure.
      # ------------------------------------------------------------------
      - name: Wait for api healthcheck
        uses: appleboy/ssh-action@v1.0.3
        env:
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
          APP_ENV: ${{ env.APP_ENV }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deployer
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command: |
            set -euo pipefail
            cd "$REMOTE_DIR"
            api_id="$(docker compose --env-file "infra/.env" -f infra/docker-compose.yml ps -q api)"
            if [ -z "$api_id" ]; then
              echo "ERROR: api container id is empty — compose did not start it."
              exit 1
            fi
            for i in $(seq 1 30); do
              state="$(docker inspect -f '{{.State.Health.Status}}' "$api_id" 2>/dev/null || echo unknown)"
              echo "probe $i/30: api health = $state"
              if [ "$state" = "healthy" ]; then
                echo "api is healthy after $i probes"
                exit 0
              fi
              sleep 5
            done
            echo "WARN: api did not become healthy within 150s; smoke test will report a precise failure."
            exit 0

      # ------------------------------------------------------------------
      # 7. Run the smoke suite against the live deployment.
      #    scripts/test/stack-smoke.sh exits 0 on full pass, 1 on
      #    failure, 2 if the stack isn't running. Any non-zero value
      #    fails this step, which fails the workflow.
      # ------------------------------------------------------------------
      - name: Run stack smoke tests against live deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deployer
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command: |
            set -euo pipefail
            cd "$REMOTE_DIR"
            bash scripts/test/stack-smoke.sh

      # ------------------------------------------------------------------
      # 8. On failure, dump the last 500 log lines of every container into
      #    the workflow run so triage does not require manual SSH.
      # ------------------------------------------------------------------
      - name: Dump container logs on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        env:
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
          APP_ENV: ${{ env.APP_ENV }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deployer
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command: |
            set +e  # best-effort: always show whatever logs exist
            cd "$REMOTE_DIR"
            echo "===== docker compose ps ====="
            docker compose --env-file "infra/.env" -f infra/docker-compose.yml ps
            echo
            echo "===== last 500 log lines per service ====="
            docker compose --env-file "infra/.env" -f infra/docker-compose.yml \
              logs --no-color --tail=500
            echo
            echo "===== scripts/test/stack-smoke.sh last run (if present) ====="
            # If the smoke script wrote its own output, surface it too.
            docker compose --env-file "infra/.env" -f infra/docker-compose.yml \
              logs --no-color monitor --tail=200 || true
