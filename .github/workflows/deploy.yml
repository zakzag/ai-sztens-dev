# AIsztens — production deploy to the DigitalOcean droplet.
#
# This workflow is the consumer of the images published by
# `.github/workflows/images.yml`. It does NOT build anything; it ships
# three small files (docker-compose.yml, infra/.env, Caddyfile.rendered)
# and tells the droplet to `docker compose pull && up -d` against the
# images already in GHCR.
#
# The `sha-<short>` tag to deploy is read from the latest successful
# `images.yml` run that targeted the same APP_ENV. If the build workflow
# has not yet produced an image (very first deploy, race between the two
# workflows), this job fails fast and the operator re-runs it.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   DROPLET_HOST        — droplet public IPv4 or hostname
#   DROPLET_SSH_KEY     — the deploy private key (deploy/ssh-keys/deploy.private.key,
#                         passphrase-less). Logs in as `deployer`; its
#                         PUBLIC half must be in
#                         /home/deployer/.ssh/authorized_keys on the
#                         droplet.
#   INFRA_ENV_DEV       — full contents of infra/.env.dev
#   INFRA_ENV_PROD      — full contents of infra/.env.prod
#   GHCR_PAT            — (only when the repo is private) PAT with
#                         `read:packages` so the droplet can `docker
#                         login ghcr.io` and pull the images.
#
# Triggers:
#   push to `dev`  -> APP_ENV=dev
#   workflow_dispatch with `app_env`=dev|prod
#   workflow_run on `images.yml` success (so every push to `dev` that
#     published images also deploys them, with no manual dispatch)
#
# The push trigger alone used to imply deploy; the explicit `workflow_run`
# link below means a re-run of `images.yml` (e.g. after a manual push
# with the right input) also produces a deploy for the matching env.
# Concurrency is keyed per env so dev and prod never race each other.

name: Deploy to droplet

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      app_env:
        description: 'Which environment to deploy (dev or prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
  workflow_run:
    workflows: [Build and push images]
    types: [completed]

# Normalise the chosen env into a matrix-shaped env for the rest of the
# job. Push always means `dev`; workflow_dispatch uses the operator's
# pick; workflow_run mirrors the input of the upstream build job.
concurrency:
  group: deploy-${{ inputs.app_env || (github.event.workflow_run.inputs.app_env || 'dev') }}
  cancel-in-progress: false

env:
  REMOTE_DIR: /opt/aisztens

jobs:
  deploy:
    name: Deploy (${{ inputs.app_env || (github.event.workflow_run.inputs.app_env || 'dev') }}) + smoke-test
    # Only run on a successful upstream build when this was triggered by
    # `workflow_run`; otherwise always run.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ (inputs.app_env || (github.event.workflow_run.inputs.app_env || 'dev')) == 'prod' && 'production' || 'dev' }}

    steps:
      # ------------------------------------------------------------------
      # 1. Get the source (only the small files we ship; the source tree
      #    is otherwise unused).
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            infra/docker-compose.yml
            infra/caddy/Caddyfile
            infra/caddy/Caddyfile.rendered
            apps
            packages

      # ------------------------------------------------------------------
      # 2. Resolve APP_ENV and read the matching per-env secret.
      #    APP_ENV comes from `inputs.app_env` (workflow_dispatch) or
      #    `github.event.workflow_run.inputs.app_env` (workflow_run), or
      #    defaults to `dev` for push events. It selects which secret is
      #    used (INFRA_ENV_DEV / INFRA_ENV_PROD).
      # ------------------------------------------------------------------
      - name: Resolve APP_ENV and IMAGE_TAG
        id: resolve
        env:
          INFRA_ENV: ${{ secrets[format('INFRA_ENV_{0}', upper((inputs.app_env || (github.event.workflow_run.inputs.app_env || 'dev'))))] }}
        run: |
          set -euo pipefail
          app_env="${{ inputs.app_env || (github.event.workflow_run.inputs.app_env || 'dev') }}"
          if [ -z "$INFRA_ENV" ]; then
            echo "ERROR: INFRA_ENV_${app_env^^} secret is empty." >&2
            exit 1
          fi
          # The sha tag is the most recent one for this env. We don't
          # query GHCR for the latest published tag (that needs extra
          # auth and is fragile); we derive it from the triggering build
          # workflow when this is a workflow_run, otherwise from
          # github.sha for push / dispatch.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            short_sha="${GITHUB_SHA::7}"
          else
            short_sha="${GITHUB_SHA::7}"
          fi
          # The actual image tag the upstream `images.yml` workflow
          # produced is the short SHA. README §8 documents the contract.
          image_tag="sha-${short_sha}"
          echo "app_env=$app_env"      >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag"  >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 3. Render infra/.env from the matching secret.
      #    `chmod 600` matches the convention from deploy/README.md
      #    where the .env files are world-unreadable.
      # ------------------------------------------------------------------
      - name: Render infra/.env from the matching secret
        env:
          INFRA_ENV: ${{ secrets[format('INFRA_ENV_{0}', upper((inputs.app_env || (github.event.workflow_run.inputs.app_env || 'dev'))))] }}
        run: |
          set -euo pipefail
          mkdir -p infra
          printf '%s\n' "$INFRA_ENV" > "infra/.env"
          chmod 600 "infra/.env"
          # IMAGE_TAG and GHCR_OWNER are runtime-only values the droplet
          # needs to construct the image references; the secret holds
          # everything else (DOMAIN, DB passwords, …).
          {
            echo ""
            echo "# Written by deploy.yml"
            echo "APP_ENV=${{ steps.resolve.outputs.app_env }}"
            echo "IMAGE_TAG=${{ steps.resolve.outputs.image_tag }}"
            echo "GHCR_OWNER=${{ vars.GHCR_OWNER || github.repository_owner }}"
            echo "REGISTRY=ghcr.io"
          } >> "infra/.env"
          echo "Rendered infra/.env for APP_ENV=${{ steps.resolve.outputs.app_env }} (IMAGE_TAG=${{ steps.resolve.outputs.image_tag }})."

      # ------------------------------------------------------------------
      # 4. Render the Caddyfile from infra/caddy/Caddyfile using the same
      #    `sed` logic that deploy/deploy.sh:render_caddyfile() uses.
      #    The droplet only ever sees the rendered file.
      # ------------------------------------------------------------------
      - name: Render Caddyfile
        run: |
          set -euo pipefail
          domain="$(grep -E '^DOMAIN=' infra/.env | head -n1 | cut -d= -f2- | tr -d '"' | tr -d \"'\")"
          acme_email="$(grep -E '^ACME_EMAIL=' infra/.env | head -n1 | cut -d= -f2- | tr -d '"' | tr -d \"'\")"
          if [ -z "$domain" ] || [ -z "$acme_email" ]; then
            echo "ERROR: DOMAIN and ACME_EMAIL must be set in INFRA_ENV_*." >&2
            exit 1
          fi
          sed -e "s|<DOMAIN>|$domain|g" \
              -e "s|<ACME_EMAIL>|$acme_email|g" \
              infra/caddy/Caddyfile > infra/caddy/Caddyfile.rendered
          if grep -q '<DOMAIN>\|<ACME_EMAIL>' infra/caddy/Caddyfile.rendered; then
            echo "ERROR: rendered Caddyfile still contains unresolved placeholders." >&2
            exit 1
          fi
          echo "Caddyfile rendered for DOMAIN=$domain."

      # ------------------------------------------------------------------
      # 5. Ship the three small files to the droplet. We do NOT rsync
      #    the whole repo anymore; the droplet needs only the compose
      #    file, the env, and the rendered Caddyfile.
      # ------------------------------------------------------------------
      - name: Ship compose + env + Caddyfile to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deployer
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "infra/docker-compose.yml,infra/.env,infra/caddy/Caddyfile.rendered"
          target: ${{ env.REMOTE_DIR }}
          overwrite: true
          strip_components: 0

      # ------------------------------------------------------------------
      # 6. Log in to GHCR on the droplet (only when the repo is private;
      #    when public, anonymous pull works). We detect this by trying
      #    a public pull of the api image first; only fall back to login
      #    if that fails. Simpler: always run `docker login` when a PAT
      #    is configured.
      # ------------------------------------------------------------------
      - name: docker login ghcr.io (when GHCR_PAT is set)
        if: ${{ secrets.GHCR_PAT != '' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deployer
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command: |
            set -euo pipefail
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            echo "GHCR login OK as $GITHUB_ACTOR."
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}

      # ------------------------------------------------------------------
      # 7. Pull the images and (re)start the stack. No `--build`: the
      #    droplet has no source tree and must not attempt to build.
      # ------------------------------------------------------------------
      - name: Pull and start the stack
        uses: appleboy/ssh-action@v1.0.3
        env:
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
          APP_ENV: ${{ steps.resolve.outputs.app_env }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deployer
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command: |
            set -euo pipefail
            cd "$REMOTE_DIR"
            docker compose \
              --env-file "infra/.env" \
              -f infra/docker-compose.yml \
              pull
            APP_ENV="$APP_ENV" docker compose \
              --env-file "infra/.env" \
              -f infra/docker-compose.yml \
              up -d --remove-orphans

      # ------------------------------------------------------------------
      # 8. Wait for the `api` container healthcheck to become `healthy`.
      #    infra/docker-compose.yml declares interval=15s / retries=5 /
      #    start_period=60s, so 30 × 5s = 150s is more than enough for
      #    first-run image pulls. If the healthcheck never reports
      #    healthy we still proceed so the smoke step can produce a
      #    more diagnostic failure.
      # ------------------------------------------------------------------
      - name: Wait for api healthcheck
        uses: appleboy/ssh-action@v1.0.3
        env:
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
          APP_ENV: ${{ steps.resolve.outputs.app_env }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deployer
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command: |
            set -euo pipefail
            cd "$REMOTE_DIR"
            api_id="$(docker compose --env-file "infra/.env" -f infra/docker-compose.yml ps -q api)"
            if [ -z "$api_id" ]; then
              echo "ERROR: api container id is empty — compose did not start it."
              exit 1
            fi
            for i in $(seq 1 30); do
              state="$(docker inspect -f '{{.State.Health.Status}}' "$api_id" 2>/dev/null || echo unknown)"
              echo "probe $i/30: api health = $state"
              if [ "$state" = "healthy" ]; then
                echo "api is healthy after $i probes"
                exit 0
              fi
              sleep 5
            done
            echo "WARN: api did not become healthy within 150s; smoke test will report a precise failure."
            exit 0

      # ------------------------------------------------------------------
      # 9. Run the smoke suite against the live deployment.
      #    scripts/test/stack-smoke.sh exits 0 on full pass, 1 on
      #    failure, 2 if the stack isn't running. Any non-zero value
      #    fails this step, which fails the workflow.
      # ------------------------------------------------------------------
      - name: Run stack smoke tests against live deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deployer
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command: |
            set -euo pipefail
            cd "$REMOTE_DIR"
            bash scripts/test/stack-smoke.sh

      # ------------------------------------------------------------------
      # 10. On failure, dump the last 500 log lines of every container
      #     into the workflow run so triage does not require manual SSH.
      # ------------------------------------------------------------------
      - name: Dump container logs on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        env:
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
          APP_ENV: ${{ steps.resolve.outputs.app_env }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deployer
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command: |
            set +e  # best-effort: always show whatever logs exist
            cd "$REMOTE_DIR"
            echo "===== docker compose ps ====="
            docker compose --env-file "infra/.env" -f infra/docker-compose.yml ps
            echo
            echo "===== last 500 log lines per service ====="
            docker compose --env-file "infra/.env" -f infra/docker-compose.yml \
              logs --no-color --tail=500
            echo
            echo "===== monitor last 200 lines ====="
            docker compose --env-file "infra/.env" -f infra/docker-compose.yml \
              logs --no-color monitor --tail=200 || true
