# =============================================================================
# docker-compose.yml  -  AI Hangasszisztens Rendszer (M1)
# -----------------------------------------------------------------------------
# Az M1 mérföldkőben csak a `livekit` szolgáltatás szerepel.
# A többi service (ai-worker, slack-bot, calendar-service, traefik, db)
# a későbbi mérföldkövekben kerül a fájlba.
#
# Indítás: docker compose up -d
# Leállítás: docker compose stop
# Referencia: docs/plans/06-configuration-docker-compose.md
# =============================================================================

name: ${PROJECT_NAME:-ai-assistant-dev}

services:
  # ---------------------------------------------------------------------------
  # LiveKit WebRTC szerver
  # ---------------------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:v1.8.0          # pinned, ne 'latest'
    container_name: ${PROJECT_NAME:-ai-assistant-dev}-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml

    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro       # konfiguráció bind mount
      # - ./data/livekit:/data                     # ha később perzisztens adatot akarunk

    ports:
      - "7880:7880"                                # HTTP / signaling / WebSocket
      - "7881:7881"                                # ICE TCP fallback
      - "7882:7882/udp"                            # media (alap UDP port)
      - "7883-7892:7883-7892/udp"                  # media range (extra résztvevők)

    environment:
      # Ezeket a docker-compose a .env-ből helyettesíti be.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}

    healthcheck:
      # A LiveKit a 7880-on szolgáltatja az /rtc végpontot; ha válaszol,
      # a szerver életben van. A `wget` az alpine-alapú image-eken biztosan
      # elérhető.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7880/rtc"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
