# AIsztens — admin dashboard SPA.
#
# Served by the admin container; Caddy terminates TLS and reverse-proxies
# https://admin.<DOMAIN>/* to this container on the internal Docker network.
# Configuration mirrors infra/web/nginx.conf so the two SPAs behave
# identically from a browser perspective (asset caching, SPA fallback,
# gzip). The two files are separate so a future divergence (e.g. admin
# needs a stricter CSP) is a single-file change.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
