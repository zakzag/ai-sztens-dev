# AIsztens — single-droplet runtime stack.
# Everything runs in Docker so the config is easy to change and the machine
# can be recreated quickly (see deploy/bootstrap.sh + deploy/deploy.sh).
#
# Services:
#   api      - NestJS + Fastify API (built from the repo root by infra/app/Dockerfile)
#   postgres - PostgreSQL with idempotent role/database init
#   caddy    - reverse proxy + automatic TLS (Let's Encrypt)
#   monitor  - watchdog that alerts when the API is down
#
# Usage (on the droplet):
#   cp infra/.env.example infra/.env   # then fill in real values
#   docker compose --env-file infra/.env -f infra/docker-compose.yml up -d --build

name: aisztens

services:
  api:
    build:
      context: ..            # repo root: pnpm workspace needs apps/* and packages/*
      dockerfile: infra/app/Dockerfile
    image: aisztens/api:latest
    restart: unless-stopped
    # Hard cap so a runaway heap cannot starve the host (the V8 heap is also
    # bounded by NODE_OPTIONS=--max-old-space-size=384 in the Dockerfile, so
    # the limit is honoured at the application level instead of the kernel
    # OOM-killer firing inside a restart loop).
    mem_limit: 400m
    environment:
      NODE_ENV: production
      # APP_ENV selects which per-env file NestJS loads at boot (see
      # `apps/api/src/app.module.ts:30`). The default is `dev` for the
      # currently running droplet; the future prod stack will pass `dev`
      # here too — only the per-env secrets differ. To turn on prod,
      # flip APP_ENV to `prod` AND set the prod-specific secrets in
      # `infra/.env.prod`.
      APP_ENV: ${APP_ENV:-dev}
      PORT: ${API_PORT:-3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      VAPI_WEBHOOK_SECRET: ${VAPI_WEBHOOK_SECRET:-}
      # Database connection will be consumed here once persistence is wired in.
      DATABASE_URL: postgres://${AISZTENS_DB_USER:-aisztens}:${AISZTENS_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-callback}
    expose:
      - "${API_PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Hit the dedicated liveness endpoint (see apps/api/src/health/health.controller.ts).
      # `/healthz` is intentionally excluded from the NestJS `api` global prefix
      # (see main.ts) so the path stays stable even if the business routing
      # changes. The shell snippet uses an explicit `process.exit(r.ok ? 0 : 1)`
      # on BOTH branches so a future change in Node's default exit code can
      # never silently turn a healthy response into a `Restarting` container.
      # The start_period is generous (60s) because cold start on the first run
      # after a deploy combines pnpm workspace symlink resolution, NestJS
      # module init and Fastify listener binding.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${API_PORT:-3000}/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Cap Postgres so its default 25%-of-host shared_buffers cannot blow the
    # 2 GB droplet. The three POSTGRES_* envs below are consumed by the
    # official image's docker-entrypoint.sh and translated into
    # postgresql.conf settings (shared_buffers, effective_cache_size, work_mem).
    mem_limit: 400m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-callback}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Passed into the init script below via psql variables.
      TKOVARI_DB_PASSWORD: ${TKOVARI_DB_PASSWORD}
      KRAK_DB_PASSWORD: ${KRAK_DB_PASSWORD}
      AISZTENS_DB_USER: ${AISZTENS_DB_USER:-aisztens}
      AISZTENS_DB_PASSWORD: ${AISZTENS_DB_PASSWORD}
      # Tuned for a 2 GB host + 400 MB container limit.
      POSTGRES_SHARED_BUFFERS: 128MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 512MB
      POSTGRES_WORK_MEM: 4MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-callback}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Caddy is small but TLS handshakes + large static SPA responses can
    # spike RSS. 64 MB is plenty and matches our actual usage (~30 MB).
    mem_limit: 64m
    # IMPORTANT: This is the ONLY Caddy on the host. Binding 80/443 here
    # means no other container (current or historical) may also bind these
    # ports. `deploy/deploy.sh:up` actively prunes orphan containers from
    # previous deployments to guarantee that.
    #
    # DigitalOcean Ubuntu droplets run `systemd-resolved` on 127.0.0.53:53
    # as a stub resolver. The Docker bridge network cannot reach that
    # address, so ACME DNS lookups fail with
    # `lookup ... 127.0.0.53:53: read: connection refused` and Caddy
    # never starts its HTTP listener. We pin an explicit public DNS so
    # ACME registration and renewal work from inside the container.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The Caddy container mounts the *rendered* Caddyfile (where the
      # `<DOMAIN>` / `<ACME_EMAIL>` placeholders in the template have
      # already been replaced with the real values), NOT the template in
      # `infra/caddy/Caddyfile`. `deploy/deploy.sh:render_caddyfile()` writes
      # the rendered file on the droplet under infra/caddy/Caddyfile.rendered
      # on every deploy.
      - ./caddy/Caddyfile.rendered:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Static SPA bundles, produced by `pnpm --filter @callback/web build`
      # and `pnpm --filter @callback/admin build` in deploy/deploy.sh and
      # rsynced to the droplet under apps/{web,admin}/dist/.
      - ${WEB_DIST_PATH:-../apps/web/dist}:/srv/web:ro
      - ${ADMIN_DIST_PATH:-../apps/admin/dist}:/srv/admin:ro
    depends_on:
      api:
        condition: service_started
    networks:
      - internal

  monitor:
    build:
      context: ./monitor
      dockerfile: Dockerfile
    image: aisztens/monitor:latest
    restart: unless-stopped
    # Watchdog does almost nothing (curl + sleep). 32 MB is generous headroom.
    mem_limit: 32m
    environment:
      # Default targets the dedicated `/healthz` endpoint exposed by
      # apps/api/src/health/health.controller.ts. It is intentionally
      # excluded from the NestJS `api` global prefix, so the path is
      # stable even when business routing changes. Falls back to `/api`
      # only if the deploy-time .env does not override it (legacy).
      TARGET_URL: ${MONITOR_TARGET_URL:-http://api:3000/healthz}
      INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-30}
      ALERT_WEBHOOK_URL: ${MONITOR_ALERT_WEBHOOK_URL:-}
      FAIL_THRESHOLD: ${MONITOR_FAIL_THRESHOLD:-2}
    depends_on:
      api:
        condition: service_started
    networks:
      - internal

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
