# AIsztens — public website SPA.
#
# Served by the web container; Caddy terminates TLS and reverse-proxies
# https://web.<DOMAIN>/* to this container on the internal Docker network.
# The runtime only serves static files; everything else (CORS preflight,
# VAPI webhooks, /healthz) stays at the API.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip the text-based responses (html, js, css, svg, etc.) — nginx
    # also does a deflate for these by default, but `gzip` covers more
    # mime types and the web SPA ships a lot of minified JS.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Cache fingerprinted assets aggressively. Vite emits them under
    # /assets/ with content hashes in the filename; index.html must NOT
    # be cached so deploys are picked up immediately.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: serve /index.html for every route so React Router
    # takes over. /index.html itself must never be cached.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
