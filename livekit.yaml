# =============================================================================
# livekit.yaml  -  LiveKit WebRTC szerver konfiguráció (M1)
# -----------------------------------------------------------------------------
# Minimális, de működőképes konfiguráció a M1 mérföldkőhöz. Bővebb beállítások
# (recording, webhook, TLS, külső IP-k) a későbbi mérföldkövekben kerülnek bele.
#
# A `keys:` szekció a $(LIVEKIT_API_KEY) / $(LIVEKIT_API_SECRET) formátumot
# használja - ezeket a docker-compose behelyettesíti indításkor a .env-ből.
#
# Referencia: docs/plans/07-configuration-livekit.md
# =============================================================================

# ----- Port és logging -----
port: 7880
bind_addresses:
  - ""             # minden interfész

logging:
  level: info
  json: false      # M1: emberbarát logok

# ----- RTC (WebRTC media) beállítások -----
rtc:
  tcp_port: 7881
  udp_port: 7882
  # M1: LAN-only használat, kliens a Pi saját hálójáról jön.
  # Ha a Pi NAT mögé kerül és WAN-ról is el kell érni, ezt true-ra kell
  # állítani M5 során (vagy Traefik + TURN szerver mellett).
  use_external_ip: false

# ----- TURN/STUN szerver (NAT-ok mögötti kliensek számára, M2+ aktív) -----
turn:
  enabled: true
  udp_port: 3478
  tls_port: 5349

# ----- Szoba beállítások -----
room:
  max_participants: 50
  empty_timeout: 300         # másodperc - ha üres, a szoba bezárul
  enable_recording: false    # M1: nincs recording

# ----- API kulcsok: a docker-compose behelyettesíti a .env-ből -----
keys:
  $(LIVEKIT_API_KEY): $(LIVEKIT_API_SECRET)
