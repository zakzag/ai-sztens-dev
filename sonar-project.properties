# AIsztens — SonarQube analysis of the whole monorepo.
#
# Used by `pnpm sonar:scan` (scripts/sonar/scan.mjs → @sonar/scan).
# Server URL and token are NEVER stored here: they come from SONAR_HOST_URL and
# SONAR_TOKEN (environment or the git-ignored sonar.env file).
#
# See docs/Specs/SonarQube.md for prerequisites and troubleshooting.

sonar.projectKey=aisztens
sonar.projectName=AIsztens
sonar.projectVersion=0.0.1
sonar.sourceEncoding=UTF-8

# All shipped source lives in the packages and apps; `scripts` holds the
# tooling (including the Sonar scripts themselves) that we also want analysed.
sonar.sources=apps/api/src,apps/web/src,apps/admin/src,packages/shared/src,packages/api-client/src,packages/ui/src,scripts

# Dedicated test directories (files inside `src` are detected by their
# *.test.ts / *.test.tsx / *.spec.ts name).
sonar.tests=apps/api/test,packages/shared/test,packages/api-client/test,packages/ui/test

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.scannerwork/**,\
  **/*.d.ts,\
  **/drizzle/meta/**,\
  apps/api/drizzle/**

# Tests intentionally repeat setup code; duplication there is not a finding.
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/test/**

# Coverage that SonarQube cannot (and should not) attribute to a source file.
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/test/**,\
  **/*.d.ts

# Single merged report produced by scripts/sonar/lcov-merge.mjs.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.javascript.node.maxspace=4096
sonar.qualitygate.wait=false
